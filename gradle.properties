# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=224m -XX:CompressedClassSpaceSize=48m -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1 -Xss512k -XX:MaxDirectMemorySize=64m -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m
org.gradle.parallel=false
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
# Kotlin code style for this project: "official" Kotlin style.
kotlin.code.style=official
# Only keep the R class for the module's own resources.
android.nonTransitiveRClass=true

# Serialize work (memory-constrained machine): prevents OOM during dexing
org.gradle.workers.max=1

# Run the Kotlin compiler inside the Gradle daemon (memory-constrained machine)
kotlin.compiler.execution.strategy=in-process
